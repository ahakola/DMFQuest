name: Update copyright year in license file

on:
  schedule:
    - cron: '0 3 1 1 *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Update license year
        uses: p3lim/license-year-updater@v2
        with:
          files: LICENSE.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "Automated: Update license to current year"
          body: "Automated yearly update of the copyright year in license files.

          No manual review of logic is required, only verification that everything remains intact."
          commit-message: Update license to current year
          branch: update-license
          delete-branch: true
